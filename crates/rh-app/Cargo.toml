[package]
name = "rh-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RemoteHub desktop application"
default-run = "rh-app"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
rh-core.workspace = true
rh-storage.workspace = true
rh-vault.workspace = true
rh-ssh.workspace = true
rh-rdp.workspace = true

portable-pty = "0.8"

# Sync client transport (slice 3b): HTTP to the rh-sync-server, bearer token in
# the OS keychain. rustls so no native TLS toolchain is needed on Windows.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring.workspace = true
# Yandex OAuth desktop flow (3b-oauth): open the system browser + a one-shot
# loopback listener catches the redirected bearer token.
open = "5"
urlencoding = "2"

tauri = { workspace = true, features = ["devtools", "tray-icon"] }

tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
chrono.workspace = true
ulid.workspace = true
base64 = "0.22"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
] }
