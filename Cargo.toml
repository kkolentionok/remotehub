[workspace]
resolver = "2"
members = [
    "crates/rh-core",
    "crates/rh-ssh",
    "crates/rh-rdp",
    "crates/rh-storage",
    "crates/rh-vault",
    "crates/rh-app",
]
# The sync server is a standalone crate (its own [workspace]); it shares no code
# with the app and builds/dockerizes independently. Excluded so `cargo build`
# / `cargo tauri dev` never touch it.
exclude = ["server"]

[workspace.package]
version = "0.3.1"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourname/remotehub"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Errors
thiserror = "2.0"
anyhow = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# IDs
ulid = { version = "1.1", features = ["serde"] }

# Secrets
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "chrono"] }
tracing-appender = "0.2"

# Bytes
bytes = "1.7"

# Storage
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "macros",
    "migrate",
] }
keyring = { version = "3.6", features = [
    "apple-native",                       # macOS Keychain
    "windows-native",                     # Windows Credential Manager
    "sync-secret-service",                # Linux Secret Service (libsecret/gnome-keyring/KWallet)
] }

# Tauri (only in rh-app)
tauri = { version = "2.1", features = [] }
tauri-build = { version = "2.0", features = [] }

# Testing
tokio-test = "0.4"

# Internal crates
rh-core = { path = "crates/rh-core" }
rh-storage = { path = "crates/rh-storage" }
rh-ssh = { path = "crates/rh-ssh" }
rh-rdp = { path = "crates/rh-rdp" }
rh-vault = { path = "crates/rh-vault" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# unwind (not abort) so a panic in a session worker thread can be caught
# (catch_unwind) and turned into a clean error instead of taking down the whole
# app. Costs some binary size (unwind tables); worth it for resilience.
panic = "unwind"
strip = true

[profile.dev]
# Tauri dev iteration speed
incremental = true

# Optimize dependencies even in dev builds. RDP needs real-time JPEG
# encoding (image) and graphics decoding (ironrdp-graphics); unoptimized
# these are 10-30× slower and make the desktop feel laggy. Our own crates
# stay unoptimized so iteration stays fast. Deps are cached after the first
# build, so this is a one-time cost.
[profile.dev.package."*"]
opt-level = 3

# rh-rdp runs the hot per-frame pixel loops (region diff, RGB extract) and
# the input/active-stage loop — optimize it even in dev so the desktop is
# responsive. Other workspace crates stay unoptimized for fast iteration.
[profile.dev.package.rh-rdp]
opt-level = 3

# RemoteHub vendors ironrdp-connector to advertise the Graphics Pipeline
# (MS-RDPEGFX) early-capability flag, which upstream IronRDP never sets and
# exposes no option for. Without it the server won't open the GFX DVC, so it
# falls back to legacy bitmap/RemoteFX. Same 0.8.0 source + one flag; re-apply
# on any IronRDP bump. See vendor/ironrdp-connector/src/connection.rs.
[patch.crates-io]
ironrdp-connector = { path = "vendor/ironrdp-connector" }
