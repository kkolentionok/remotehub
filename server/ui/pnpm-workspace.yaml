# pnpm v11+ workspace configuration.
#
# This file is required even though we don't have a real workspace structure
# because pnpm v11 reads its settings here, not from `package.json`.
# See: https://pnpm.io/blog/releases/11.0
#
# `allowBuilds` is the v11 replacement for the old `onlyBuiltDependencies`
# field. It controls which packages may run install/build scripts:
#
# - `true`  — allowed (will run postinstall, etc.)
# - `false` — explicitly denied
# - missing — treated as "unreviewed", causes ERR_PNPM_IGNORED_BUILDS
#
# `esbuild` runs a postinstall step that downloads the native binary for the
# host platform. Vite uses esbuild as its bundler, so without this allowed,
# `pnpm install` fails outright on pnpm v11.
allowBuilds:
    esbuild: true
