[graph]
all-features = false

[output]
feature-depth = 1

[advisories]
version = 2
ignore = []

[licenses]
version = 2
# Permissive licenses only — RemoteHub may be open-sourced.
# We explicitly reject GPL/LGPL/MPL family to keep options open.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
    "CC0-1.0",
]
confidence-threshold = 0.93

# MPL-2.0 is technically file-level copyleft, but it's commonly used in the
# Rust ecosystem (webpki-roots, etc.). We allow it pragmatically; static
# linking does not trigger source-disclosure for the application itself.

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
